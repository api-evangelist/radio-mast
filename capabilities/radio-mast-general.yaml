naftiko: 1.0.0-alpha2
info:
  label: Radio Mast API
  description: 'Radio Mast API. 1 operations. Lead operation: List available API resources. Self-contained Naftiko capability
    covering one Radio Mast business surface.'
  tags:
  - Radio Mast
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RADIO_MAST_API_KEY: RADIO_MAST_API_KEY
capability:
  consumes:
  - type: http
    namespace: radio-mast-general
    baseUri: https://api.radiomast.io/v1
    description: Radio Mast API business capability. Self-contained, no shared references.
    resources:
    - name: root
      path: /
      operations:
      - name: get
        method: GET
        description: List available API resources
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.RADIO_MAST_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: radio-mast-general-rest
    port: 8080
    description: REST adapter for Radio Mast API. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1
      name: root
      description: REST surface for root.
      operations:
      - method: GET
        name: get
        description: List available API resources
        call: radio-mast-general.get
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: radio-mast-general-mcp
    port: 9090
    transport: http
    description: MCP adapter for Radio Mast API. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-available-api-resources
      description: List available API resources
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: radio-mast-general.get
      outputParameters:
      - type: object
        mapping: $.
